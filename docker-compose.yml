name: cdb

services:
  cdb-api:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: cdb-api
    restart: unless-stopped
    command: uvicorn cdb.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src/backend:/app
      - ./data/uploads:/app/storage/uploads
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_DIR=/app/storage/uploads
      - DATABASE_URL=postgresql+asyncpg://cdb:cdb@cdb-db:5432/cdb
      - SYNC_DATABASE_URL=postgresql://cdb:cdb@cdb-db:5432/cdb
      - REDIS_URL=redis://cdb-redis:6379/0
      - CELERY_BROKER_URL=redis://cdb-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://cdb-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-${CDB_SECRET_KEY:-development-secret-key-at-least-32-characters-long}}
      - CDB_API_KEY=${CDB_API_KEY:-development-api-key}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN:-${LINKEDIN_MEMBER_DATA_PORTABILITY_API_TOKEN:-}}
      - FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-admin@cdb.internal}
      - FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-admin123456}
      - FIRST_SUPERUSER_FULL_NAME=${FIRST_SUPERUSER_FULL_NAME:-CDB Admin}
    depends_on:
      cdb-db:
        condition: service_healthy
      cdb-redis:
        condition: service_started
    networks:
      - cdb_network
      - jager_network

  cdb-worker:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: cdb-worker
    restart: unless-stopped
    command: celery -A cdb.workers.celery_app worker --loglevel=info
    volumes:
      - ./src/backend:/app
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://cdb:cdb@cdb-db:5432/cdb
      - SYNC_DATABASE_URL=postgresql://cdb:cdb@cdb-db:5432/cdb
      - REDIS_URL=redis://cdb-redis:6379/0
      - CELERY_BROKER_URL=redis://cdb-redis:6379/0
      - CELERY_RESULT_BACKEND=redis://cdb-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-${CDB_SECRET_KEY:-development-secret-key-at-least-32-characters-long}}
      - CDB_API_KEY=${CDB_API_KEY:-development-api-key}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN:-${LINKEDIN_MEMBER_DATA_PORTABILITY_API_TOKEN:-}}
    depends_on:
      cdb-db:
        condition: service_healthy
      cdb-redis:
        condition: service_started
    networks:
      - cdb_network

  cdb-db:
    image: pgvector/pgvector:pg16  # aligned with Jager's pgvector image (pg15→pg16)
    container_name: cdb-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cdb
      POSTGRES_USER: cdb
      POSTGRES_PASSWORD: cdb
    volumes:
      - cdb_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # Host port 5433 avoids conflict with Jager default 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdb -d cdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cdb_network
      # cdb-db is NOT on jager_network — Jager services have no direct DB access

  cdb-redis:
    image: redis:7-alpine
    container_name: cdb-redis
    restart: unless-stopped
    volumes:
      - cdb_redis_data:/data
    ports:
      - "6380:6379" # Host port 6380 avoids conflict with default 6379
    networks:
      - cdb_network

  cdb-frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: cdb-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - INTERNAL_API_URL=http://cdb-api:8000
      # NEXT_PUBLIC_API_URL intentionally omitted — client-side API calls use relative
      # /api/v1/* URLs which Caddy routes to cdb-api on the same origin (cdb.com)
    depends_on:
      - cdb-api
    networks:
      - cdb_network
      - jager_network

volumes:
  cdb_db_data:
  cdb_redis_data:

networks:
  cdb_network:
    driver: bridge
  jager_network:
    external: true

