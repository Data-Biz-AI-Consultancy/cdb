name: Release & Semantic Versioning

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to promote/tag (leave blank for latest main)"
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── Step 1: Semantic Release ─────────────────────────────────────────────────
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Semantic Release plugins
        run: |
          npm install --no-save \
            semantic-release@^24.0.0 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Run Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

  # ─── Step 2: Build natively per platform, push by digest ─────────────────────
  build:
    name: Build ${{ matrix.service }} (${{ matrix.platform }})
    needs: release
    if: needs.release.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./src/backend
            dockerfile: ./src/backend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - service: backend
            context: ./src/backend
            dockerfile: ./src/backend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - service: frontend
            context: ./src/frontend
            dockerfile: ./src/frontend/Dockerfile
            platform: linux/amd64
            runner: ubuntu-latest
          - service: frontend
            context: ./src/frontend
            dockerfile: ./src/frontend/Dockerfile
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set lower case image name
        id: repo
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=${{ steps.repo.outputs.IMAGE }},push-by-digest=true,name-canonical=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.service }}
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.service }}/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.service }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/${{ matrix.service }}/*
          if-no-files-found: error
          retention-days: 1

  # ─── Step 3: Merge into a multi-arch manifest and tag ─────────────────────────
  merge:
    name: Merge ${{ matrix.service }} manifests
    needs: [release, build]
    if: needs.release.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests/${{ matrix.service }}
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true

      - name: Set lower case image name
        id: repo
        run: |
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')-${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=production
            type=raw,value=v${{ needs.release.outputs.new_release_version }},enable=${{ needs.release.outputs.new_release_published == 'true' }}
            type=raw,value=${{ needs.release.outputs.new_release_version }},enable=${{ needs.release.outputs.new_release_published == 'true' }}

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests/${{ matrix.service }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.repo.outputs.IMAGE }}@sha256:%s ' *)

      - name: Inspect final manifest
        run: |
          docker buildx imagetools inspect ${{ steps.repo.outputs.IMAGE }}:production
