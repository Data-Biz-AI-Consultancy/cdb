name: Release & Semantic Versioning

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to promote/tag (leave blank for latest main)"
        required: false

jobs:
  release:
    name: Semantic Release & Image Publishing
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Semantic Release plugins
        run: |
          npm install --no-save \
            semantic-release@^24.0.0 \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/exec \
            @semantic-release/git \
            @semantic-release/github

      - name: Run Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release

      - name: Set up Docker Buildx
        if: steps.semantic.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.semantic.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        if: steps.semantic.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-backend:production
            ghcr.io/${{ github.repository }}-backend:latest
            ghcr.io/${{ github.repository }}-backend:v${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}-backend:${{ steps.semantic.outputs.new_release_version }}

      - name: Build and push Frontend Image
        if: steps.semantic.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:production
            ghcr.io/${{ github.repository }}-frontend:latest
            ghcr.io/${{ github.repository }}-frontend:v${{ steps.semantic.outputs.new_release_version }}
            ghcr.io/${{ github.repository }}-frontend:${{ steps.semantic.outputs.new_release_version }}
