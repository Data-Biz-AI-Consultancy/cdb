name: CI — Build & Push Staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "src/backend/pyproject.toml"
          python-version: "3.12"

      - name: Install dependencies
        working-directory: src/backend
        run: |
          uv sync --extra dev

      - name: Run Ruff Linter
        working-directory: src/backend
        run: |
          uv run ruff check .

      - name: Run Pytest
        working-directory: src/backend
        env:
          PYTHONPATH: .
        run: |
          uv run pytest -v

  build-staging:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lower case repository name
        id: repo
        run: |
          echo "IMAGE_PREFIX=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend staging image
        uses: docker/build-push-action@v5
        with:
          context: ./src/backend
          file: ./src/backend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.IMAGE_PREFIX }}-backend:staging
            ${{ steps.repo.outputs.IMAGE_PREFIX }}-backend:sha-${{ github.sha }}

      - name: Build and push Frontend staging image
        uses: docker/build-push-action@v5
        with:
          context: ./src/frontend
          file: ./src/frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.repo.outputs.IMAGE_PREFIX }}-frontend:staging
            ${{ steps.repo.outputs.IMAGE_PREFIX }}-frontend:sha-${{ github.sha }}
